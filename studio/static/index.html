<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail Studio</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0f1115; --panel: #171a21; --bubble: #1f232c; --mine: #2a4f9e; --line: #2a2f3a; --text: #e8eaf0; --muted: #9aa1b2;
          --accent: #4b8bff; --ok: #3ccf8e; --bad: #ff6b6b; --warn: #ffb86b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr; height: 100vh; }
  @media (min-width: 900px) { .app { grid-template-columns: minmax(0, 1fr) 400px; } }
  @media (max-width: 899px) {  /* a phone: the cover on top, kept small, the chat under it */
    .app { height: auto; }
    .live { order: -1; border-bottom: 1px solid var(--line); }
    .shot img { max-height: 46vh; width: auto; max-width: 100%; margin: 0 auto; }
    .chat { height: 100vh; border-right: 0; }
  }
  .chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header b { font-size: 16px; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 640px; padding: 10px 14px; border-radius: 14px; background: var(--bubble); }
  .msg.bot { align-self: flex-start; border-top-left-radius: 4px; }
  .msg.me { align-self: flex-end; background: var(--mine); border-top-right-radius: 4px; }
  .msg .change { color: #c8d6ff; font-size: 12px; margin-left: 8px; cursor: pointer; text-decoration: underline; }
  .msg img.thumb { display: block; max-width: 120px; border-radius: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dots { display: inline-flex; gap: 2px; margin-right: 6px; vertical-align: -1px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #0006; display: inline-block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; margin-top: 10px; }
  .card { background: none; border: 2px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; color: var(--text); text-align: left; font: inherit; }
  .card:hover, .card.on { border-color: var(--accent); }
  .card img, .card .ph { width: 100%; aspect-ratio: 9/16; border-radius: 8px; display: block; background: var(--line); }
  .card span { display: block; font-size: 12px; padding: 4px 2px 0; }
  .card em { font-style: normal; font-size: 10px; background: var(--ok); color: #062; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
  .heads { display: grid; gap: 8px; margin-top: 10px; }
  .head { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; color: var(--text); font: inherit; }
  .head:hover, .head.on { border-color: var(--accent); }
  .head small { display: block; color: var(--muted); }
  .head b { display: block; font-size: 18px; letter-spacing: .3px; }
  .roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; font-size: 12px; }
  .roles label { display: flex; align-items: center; gap: 6px; }
  input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  .composer { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px; align-items: flex-end; }
  .composer[hidden] { display: none; }
  textarea, input[type=text] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; }
  textarea { min-height: 44px; max-height: 160px; resize: vertical; }
  button.send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .drop { display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 12px; padding: 22px; margin-top: 10px; cursor: pointer; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s 0.8s linear infinite; margin-right: 6px; vertical-align: -1px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .live { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; }
  .tabs button.on { border-color: var(--accent); color: #fff; }
  .shot { position: relative; }
  .shot img { width: 100%; border-radius: 12px; display: block; }
  .shot.grid34 img { aspect-ratio: 3/4; object-fit: cover; }
  .shot .busy { position: absolute; inset: 0; display: grid; place-items: center; background: #0009; border-radius: 12px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--accent); }
  .muted { color: var(--muted); } .small { font-size: 12px; } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; } td { padding: 3px 0; } td:last-child { text-align: right; }
  .sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -2px; margin: 0 3px 0 6px; }
  a.dl { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; border: 1px dashed var(--line); border-radius: 12px; }
</style>
</head>
<body>
<div class="app">
  <section class="chat">
    <header><b>Thumbnail Studio</b><button id="restart" class="ghost">New cover</button></header>
    <div id="log" class="log" aria-live="polite"></div>
    <form id="composer" class="composer" hidden>
      <textarea id="text" rows="2"></textarea>
      <button class="send" type="submit">Send</button>
    </form>
  </section>
  <aside class="live">
    <div class="tabs"><button id="t_cut" class="ghost on">With cut-out</button><button id="t_plain" class="ghost">Without cut-out</button></div>
    <div id="shot" class="shot"><div class="empty">Your cover shows up here, and changes as you answer.</div></div>
    <div class="small" style="display:flex;justify-content:space-between;align-items:center">
      <label><input id="grid" type="checkbox"> Profile grid crop (3:4)</label><a id="dl" class="dl" hidden>Download</a></div>
    <div id="checks" class="small"></div>
    <div id="budget" class="small"></div>
    <div id="costs" class="small"></div>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const usd = (n) => n === 0 ? "free" : n < 0.01 ? "$" + n.toFixed(4) : "$" + n.toFixed(2);
const STAGES = { read: "Reading the frame", look: "Kimi K3 is looking at it", write: "GLM 5.3 is writing headlines", draw: "Drawing" };
const TOPICS = {
  "Launch": "Launch of [game] at our store. Available now.",
  "Unboxing": "Unboxing [product] at our store. In stock now.",
  "Tournament": "[game] tournament at our store. Winner: [name].",
  "Happy customer": "A customer picked up [product] at our store. Transcript: '...'",
  "Offer": "[offer] on [product] this week only.",
  "Pre-order": "[game] is up for pre-order at our store. Out on [date].",
};
const ORDER = ["frame", "context", "working", "design", "colours", "headline", "ready"];

// state: the cover from the server, plus the chat's own progress (kept per cover in this browser)
let S = { step: "frame", frameUrl: null, file: null, context: null, cover: null, previews: null, designs: [], palettes: null,
          colourLabel: null, view: "cut", editing: null, warnedFor: null };
let timer = null;

async function api(path, init) {
  const r = await fetch(path, init);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
const patch = (changes) => api("/api/covers/" + S.cover.id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(changes) });

function remember() {
  if (!S.cover) return;
  try { localStorage.setItem("chat:" + S.cover.id, JSON.stringify({ step: S.step, colourLabel: S.colourLabel, wasReady: S.wasReady })); } catch (e) { /* private mode */ }
}
function recall(id) {
  try { return JSON.parse(localStorage.getItem("chat:" + id) || "null"); } catch (e) { return null; }
}

// --- the conversation ----------------------------------------------------------------------------

const bot = (html) => `<div class="msg bot">${html}</div>`;
const me = (html, step) => `<div class="msg me">${html}${step && S.cover?.status === "done" ? `<span class="change" data-goto="${step}">change</span>` : ""}</div>`;
const past = (step) => ORDER.indexOf(S.step) > ORDER.indexOf(step);

function render() {
  const c = S.cover, out = [];
  out.push(bot("Hi! I'll make a reel cover that gets people to watch. First, drop the frame you picked from the video."
    + (S.step === "frame" ? `<label class="drop" id="drop">Click or drop an image here<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>` : "")));
  if (S.frameUrl) out.push(me(`<img class="thumb" src="${S.frameUrl}" alt="Your frame">`));
  if (past("frame")) {
    out.push(bot("What's the video about? Paste the caption, transcript or a few notes, or tap one to start from."
      + (S.step === "context" ? `<div class="chips">${Object.keys(TOPICS).map((t) => `<button class="chip" data-topic="${t}">${t}</button>`).join("")}
         <button class="chip" data-skip="1">Skip: just the frame</button></div>` : "")));
  }
  if (past("context")) out.push(me(esc(S.context) || "<i>No notes, just the frame</i>"));
  if (past("context") && c) {
    if (c.status === "failed") out.push(bot(`<span class="bad">That didn't work: ${esc(c.error)}</span><div class="chips"><button class="chip" data-restart="1">Start again</button></div>`));
    else if (c.status !== "done" || !c.spec) out.push(bot(`<span class="spin"></span>${STAGES[c.stage] || "Starting"}…`));
    else {
      const lk = c.look || {};
      out.push(bot((lk.game ? `I see <b>${esc(lk.game)}</b>. ` : "I don't see a game I'm sure of. ") + esc(lk.seen)
        + (lk.hook ? `<br><span class="muted">The hook:</span> “${esc(lk.hook)}”` : "")));
      out.push(bot("Pick a design. Each one is your frame already; the first three suit it best." + (S.step === "design" ? designCards() : "")));
      if (past("design")) out.push(me("Design: " + esc(designName(c.spec.design)), "design"));
      if (past("design")) out.push(bot("Which colours?" + (S.step === "colours" ? colourChips() : "")));
      if (past("colours")) {
        out.push(me("Colours: " + esc(S.colourLabel || "as they are"), "colours"));
        if ((c.readability || []).length) out.push(bot(`<span class="warn">${c.readability.map(esc).join(" ")}</span>`
          + `<div class="chips"><button class="chip" data-colours="design">Let the design pick readable colours</button><button class="chip" data-keep="1">Keep mine</button></div>`));
      }
      if (past("colours")) out.push(bot((c.headlines.length ? `Pick a headline. I wrote ${c.headlines.length}, each on a different hook.` : "Keep this headline, or write your own.")
        + (S.step === "headline" ? headlineCards() : "")));
      if (past("headline")) out.push(me(`${esc(c.spec.line1)} <b>${esc(c.spec.line2)}</b>`, "headline"));
      if (S.step === "ready") out.push(bot(readyMessage()));
    }
  }
  $("log").innerHTML = out.join("");
  $("log").scrollTop = $("log").scrollHeight;
  const typing = S.step === "context" || S.editing === "headline";
  $("composer").hidden = !typing;
  $("text").placeholder = S.editing === "headline" ? "Small line / BIG LINE  (e.g. You won't believe / This SSD)" : "Caption, transcript, game, event, offer…";
  live();
  remember();
}

function designName(id) { return (S.designs.find((d) => d.id === id) || { name: id }).name; }

function designCards() {
  const rec = S.cover.recommended || [];
  const ids = [...rec, ...S.designs.map((d) => d.id).filter((id) => !rec.includes(id))];
  return `<div class="chips"><button class="chip primary" data-design="${rec[0] || S.cover.spec.design}">You choose</button></div><div class="cards">`
    + ids.map((id) => {
      const d = S.designs.find((x) => x.id === id) || { name: id, blurb: "" };
      const img = S.previews && S.previews[id] ? `<img src="${S.previews[id]}" alt="${esc(d.name)}" loading="lazy">` : `<div class="ph"></div>`;
      return `<button class="card ${S.cover.spec.design === id ? "on" : ""}" data-design="${id}" title="${esc(d.blurb)} (from ${esc(d.from)})">${img}<span>${esc(d.name)}${rec.includes(id) ? "<em>Recommended</em>" : ""}</span></button>`;
    }).join("") + `</div>`;
}

const dots = (cols) => `<span class="dots">${["bg", "big", "highlight"].map((k) => cols[k] ? `<i style="background:${cols[k]}"></i>` : "").join("")}</span>`;
function colourChips() {
  const lk = S.cover.look || {}, p = S.palettes || { presets: [], roles: {} };
  const game = lk.bg || lk.accent ? `<button class="chip" data-colours="game" data-label="Game colours">${dots({ bg: lk.bg, big: lk.accent })}Game colours</button>` : "";
  const custom = S.editing === "colours" ? `<div class="roles">${Object.entries(p.roles).map(([k, label]) =>
    `<label><input type="color" data-role="${k}" value="${(S.cover.spec.colors || {})[k] || "#808080"}">${esc(label)}</label>`).join("")}</div>
    <div class="chips"><button class="chip primary" data-custom-done="1">Done</button></div>` : "";
  return `<div class="chips">${game}<button class="chip" data-colours="design" data-label="The design's own">The design's own</button>`
    + p.presets.map((x) => `<button class="chip" data-colours="${x.id}" data-label="${esc(x.label)}">${dots(x.colors)}${esc(x.label)}</button>`).join("")
    + `<button class="chip" data-custom="1">Custom…</button></div>${custom}`;
}

function headlineCards() {
  const c = S.cover;
  if (!c.headlines.length)  // a cover made before there were three options: its own words, and writing new ones
    return `<div class="heads"><button class="head on" data-keep-words="1"><small>${esc(c.spec.line1)}</small><b>${esc(c.spec.line2)}</b></button></div>`
      + `<div class="chips"><button class="chip" data-own="1">Write my own</button></div>`;
  return `<div class="heads">` + c.headlines.map((h, i) => `<button class="head ${c.headline === i ? "on" : ""}" data-headline="${i}">
      <small>${esc(h.line1)}</small><b>${esc(h.line2)}</b><small>${h.pill_left || h.pill_right ? esc([h.pill_left, h.pill_right].filter(Boolean).join(" | ")) + " · " : ""}${esc(h.why)}</small></button>`).join("")
    + `</div><div class="chips"><button class="chip" data-own="1">Write my own</button></div>`;
}

function readyMessage() {
  const c = S.cover, bad = Object.values(c.checks || {}).flat().filter((k) => !k.ok);
  return `Your cover is ready, in two versions: with the subject cut out and without.`
    + (bad.length ? `<br><span class="warn">${[...new Set(bad.map((k) => k.detail))].map(esc).join(" ")}</span>` : `<br><span class="ok">✓ All checks pass</span>`)
    + `<div class="chips"><a class="chip" href="${c.images.cut}&download=1">Download with cut-out</a><a class="chip" href="${c.images.plain}&download=1">Download without</a></div>`
    + `<div class="chips"><button class="chip" data-goto="design">Change design</button><button class="chip" data-goto="colours">Change colours</button>`
    + `<button class="chip" data-goto="headline">Change headline</button><button class="chip" data-restart="1">New cover</button></div>`;
}

// --- the live cover --------------------------------------------------------------------------------

function live() {
  const c = S.cover;
  $("t_cut").classList.toggle("on", S.view === "cut");
  $("t_plain").classList.toggle("on", S.view === "plain");
  if (!c || !c.images) {
    const working = c && (c.status === "queued" || c.status === "running");
    $("shot").innerHTML = S.frameUrl ? `<img src="${S.frameUrl}" alt="Your frame">${working ? `<div class="busy"><span><span class="spin"></span>Working…</span></div>` : ""}`
      : `<div class="empty">Your cover shows up here, and changes as you answer.</div>`;
    $("dl").hidden = true;
  } else {
    $("shot").innerHTML = `<img src="${c.images[S.view]}" alt="Your cover">${S.busy ? `<div class="busy"><span class="spin"></span></div>` : ""}`;
    $("dl").hidden = false;
    $("dl").href = c.images[S.view] + "&download=1";
  }
  if (!c) { $("checks").innerHTML = $("budget").innerHTML = $("costs").innerHTML = ""; return; }
  const checks = (c.checks || {})[S.view] || [];
  $("checks").innerHTML = checks.map((k) => `<div class="${k.ok ? "ok" : "bad"}">${k.ok ? "✓" : "!"} ${esc(k.detail)}</div>`).join("");
  const pct = Math.min(100, c.used_usd / c.budget_usd * 100);
  $("budget").innerHTML = `<div style="display:flex;justify-content:space-between"><span>Budget used</span><span>${usd(c.used_usd)} of ${usd(c.budget_usd)} (${pct > 0 && pct < 1 ? "<1" : pct.toFixed(0)}%)</span></div>`
    + `<div class="bar"><div style="width:${Math.max(pct, c.used_usd > 0 ? 1 : 0)}%;background:${pct > 90 ? "var(--bad)" : "var(--accent)"}"></div></div>`;
  const lk = c.look || {};
  $("costs").innerHTML = `<table>${c.costs.map((r) => `<tr><td>${r.step === "look" ? "Look" : "Write"}: ${esc(r.model)}${r.ok < r.calls ? ` <span class="bad">(${r.calls - r.ok} failed)</span>` : ""}</td><td>${usd(r.usd)}</td></tr>`).join("")}
    <tr><td>Reading, previews, drawing: code</td><td>free</td></tr></table>`
    + (lk.game ? `<div class="muted" style="margin-top:6px">${esc(lk.game)}${[lk.bg, lk.accent].filter(Boolean).map((h) => `<span class="sw" style="background:${h}"></span>${h}`).join("")}</div>` : "");
}

// --- answers ---------------------------------------------------------------------------------------

function go(step) { S.step = step; S.editing = null; render(); if (step === "design") loadPreviews(); }
function next(after) {
  // after an answer: the next unanswered step, or straight back to the cover when this was a change
  S.step = S.wasReady ? "ready" : ORDER[ORDER.indexOf(after) + 1];
  if (S.step === "ready") S.wasReady = true;
  S.editing = null;
  render();
}

async function choose(changes, after, label) {
  S.busy = true; live();
  try {
    S.cover = await patch(changes);
    if (label !== undefined) S.colourLabel = label;
  } catch (err) { alert(err.message); }
  S.busy = false;
  next(after);
}

async function loadPreviews() {
  if (!S.cover || S.cover.status !== "done") return;
  try { S.previews = await api(`/api/covers/${S.cover.id}/previews`); } catch (err) { S.previews = {}; }
  if (S.step === "design") render();
}

function poll() {
  clearTimeout(timer);
  api("/api/covers/" + S.cover.id).then((c) => {
    S.cover = c;
    if (c.status === "queued" || c.status === "running") { timer = setTimeout(poll, 1200); render(); return; }
    if (c.status === "done" && S.step === "working") { S.step = "design"; render(); loadPreviews(); return; }
    render();
  }).catch((err) => { $("log").insertAdjacentHTML("beforeend", bot(`<span class="bad">${esc(err.message)}</span>`)); });
}

async function start(context) {
  S.context = context;
  S.step = "working";
  render();
  const fd = new FormData();
  fd.append("frame", S.file);
  fd.append("context", context || "");
  try {
    S.cover = await api("/api/covers", { method: "POST", body: fd });
    history.replaceState(null, "", "?id=" + S.cover.id);
    poll();
  } catch (err) {
    S.step = "context";
    render();
    $("log").insertAdjacentHTML("beforeend", bot(`<span class="bad">${esc(err.message)}</span>`));
  }
}

function pickFile(f) {
  if (!f) return;
  S.file = f;
  S.frameUrl = URL.createObjectURL(f);
  S.step = "context";
  render();
  $("text").focus();
}

$("log").addEventListener("click", (e) => {
  const t = e.target.closest("[data-topic],[data-skip],[data-design],[data-colours],[data-custom],[data-custom-done],[data-headline],[data-own],[data-goto],[data-restart],[data-keep],[data-keep-words],#drop");
  if (!t) return;
  if (t.id === "drop") return $("file").click();
  const d = t.dataset;
  if (d.topic) { $("text").value = TOPICS[d.topic]; $("text").focus(); $("text").setSelectionRange(0, 0); }
  else if (d.skip) start("");
  else if (d.design) choose({ design: d.design }, "design");
  else if (d.colours) choose({ colors: d.colours }, "colours", d.label || "The design's own");
  else if (d.custom) { S.editing = "colours"; render(); }
  else if (d.customDone) { S.colourLabel = "Custom"; next("colours"); }
  else if (d.keep) next("colours");
  else if (d.keepWords) next("headline");
  else if (d.headline) choose({ headline: Number(d.headline) }, "headline");
  else if (d.own) { S.editing = "headline"; render(); $("text").focus(); }
  else if (d.goto) go(d.goto);
  else if (d.restart) restart();
});
$("log").addEventListener("change", (e) => {
  if (e.target.id === "file") pickFile(e.target.files[0]);
  if (e.target.dataset.role) patch({ colors: { [e.target.dataset.role]: e.target.value } }).then((c) => { S.cover = c; live(); });
});
$("log").addEventListener("dragover", (e) => { if (S.step === "frame") { e.preventDefault(); $("drop")?.classList.add("over"); } });
$("log").addEventListener("drop", (e) => { if (S.step === "frame") { e.preventDefault(); pickFile(e.dataTransfer.files[0]); } });

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("text").value.trim();
  $("text").value = "";
  if (S.editing === "headline") {
    const [a, b] = v.includes("/") ? v.split("/").map((x) => x.trim()) : ["", v];
    if (!b) return;
    choose({ line1: a, line2: b }, "headline");
  } else if (S.step === "context") start(v);
});
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); } });

$("t_cut").addEventListener("click", () => { S.view = "cut"; live(); });
$("t_plain").addEventListener("click", () => { S.view = "plain"; live(); });
$("grid").addEventListener("change", (e) => $("shot").classList.toggle("grid34", e.target.checked));
$("restart").addEventListener("click", () => restart());

function restart() {
  clearTimeout(timer);
  history.replaceState(null, "", location.pathname);
  S = { ...S, step: "frame", frameUrl: null, file: null, context: null, cover: null, previews: null, colourLabel: null, editing: null, wasReady: false };
  render();
}

// --- start ---------------------------------------------------------------------------------------------

Promise.all([api("/api/designs"), api("/api/palettes")]).then(async ([ds, p]) => {
  S.designs = ds; S.palettes = p;
  const id = new URLSearchParams(location.search).get("id");
  if (id) {  // reopen a cover: its conversation as far as it went
    try {
      S.cover = await api("/api/covers/" + id);
      const saved = recall(id) || {};
      S.frameUrl = S.cover.frame; S.context = S.cover.context;
      S.colourLabel = saved.colourLabel || null;
      S.step = S.cover.status === "done" ? (saved.step || "ready") : "working";
      S.wasReady = saved.wasReady ?? S.step === "ready";
      if (S.cover.status !== "done") poll();
    } catch (err) { S.step = "frame"; }
  }
  render();
  if (S.step === "design") loadPreviews();
});
</script>
</body>
